[package]
name = "sticky-markdown-note"
version = "0.1.0"
description = "Windows sticky-note style Markdown viewer"
authors = ["Sticky Markdown Note"]
edition = "2021"

[lib]
name = "sticky_markdown_note_lib"
# Desktop(Windows)만 빌드하므로 rlib 하나면 충분.
# 안드로이드/iOS 빌드를 다시 할 경우 "staticlib", "cdylib" 를 되살릴 것.
crate-type = ["lib"]

# dev 빌드 시 디버그 심볼 생성을 끄면 컴파일/링크가 눈에 띄게 빨라짐.
# (디버거로 스택 추적할 일이 생기면 이 줄을 지우거나 debug = true 로)
[profile.dev]
debug = 0

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
tauri-plugin-opener = "2.5.0"
tauri-plugin-shell = "2.3.0"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-autostart = "2.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
dirs = "5.0"
